name: Laravel CD

on:
  workflow_run:
    workflows: ["Laravel CI"]
    types:
      - completed
  workflow_dispatch:

jobs:
  build-and-push:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, dom, ctype, iconv, intl, pdo, pdo_mysql, curl, zip, bcmath, gd, fileinfo
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        working-directory: cdw_stadium_project
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cdw_stadium_project/package-lock.json

      - name: Install NPM dependencies and build
        working-directory: cdw_stadium_project
        run: |
          npm ci || npm install
          npm run build

      - name: Set lower case repository name and image metadata
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"
          TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "IMAGE_SHA=${TARGET_SHA::7}" >> "${GITHUB_ENV}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -f ./cdw_stadium_project/dockerfile \
            -t ghcr.io/${{ env.REPO_LC }}:latest \
            -t ghcr.io/${{ env.REPO_LC }}:${{ env.IMAGE_SHA }} \
            ./cdw_stadium_project

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ env.REPO_LC }}:latest
          docker push ghcr.io/${{ env.REPO_LC }}:${{ env.IMAGE_SHA }}