name: Laravel CD

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/trover204/cdw_project_nhomh:latest \
            ./cdw_stadium_project

      - name: Push Docker image
        run: |
          docker push ghcr.io/trover204/cdw_project_nhomh:latest