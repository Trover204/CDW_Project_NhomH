name: Laravel CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

defaults:
  run:
    working-directory: cdw_stadium_project

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_test
          MYSQL_USER: laravel
          MYSQL_PASSWORD: password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      # ========================================
      # 1. Lấy source code
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # 2. Cài PHP 8.3
      # ========================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql
          coverage: none


      # ========================================
      # 3. Kiểm tra PHP
      # ========================================
      - name: Check PHP version
        run: php -v


      # ========================================
      # 4. Cài Composer dependencies
      # ========================================
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress


      # ========================================
      # 5. Setup Node.js and build frontend
      # ========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cdw_stadium_project/package-lock.json

      - name: Install NPM dependencies and build
        run: |
          npm install
          npm run build

      # ========================================
      # 6. Tạo file .env cho CI
      # ========================================
      - name: Prepare environment
        run: |
          cp .env.example .env

          cat >> .env << 'EOF'

          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=laravel_test
          DB_USERNAME=laravel
          DB_PASSWORD=password
          EOF

          php artisan key:generate


      # ========================================
      # 7. Kiểm tra database configuration
      # ========================================
      - name: Check database configuration
        run: |
          php artisan config:clear
          php artisan about

      # ========================================
      # 8. Clear Laravel cache
      # ========================================
      - name: Clear Laravel cache
        run: php artisan optimize:clear || true

      # ========================================
      # 9. Chạy migration
      # ========================================
      - name: Run migrations
        run: php artisan migrate --force

      # ========================================
      # 10. Chạy Laravel tests
      # ========================================
      - name: Run tests
        run: php artisan test