name: Laravel CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

defaults:
  run:
    working-directory: cdw_stadium_project

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_test
          MYSQL_USER: laravel
          MYSQL_PASSWORD: password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      # ========================================
      # 1. Lấy source code
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # 2. Cài PHP 8.3 & đầy đủ extensions
      # ========================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, dom, ctype, iconv, intl, pdo, pdo_mysql, pdo_sqlite, sqlite3, curl, zip, bcmath, gd, fileinfo
          tools: composer:v2
          coverage: none

      # ========================================
      # 3. Kiểm tra PHP & Extensions
      # ========================================
      - name: Check PHP version
        run: |
          php -v
          php -m

      # ========================================
      # 4. Cài Composer dependencies
      # ========================================
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # ========================================
      # 5. Setup Node.js and build frontend
      # ========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cdw_stadium_project/package-lock.json

      - name: Install NPM dependencies and build
        run: |
          npm ci || npm install
          npm run build

      # ========================================
      # 6. Tạo file .env cho CI
      # ========================================
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=mysql|' .env
          sed -i 's|^# *DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i 's|^# *DB_PORT=.*|DB_PORT=3306|' .env
          sed -i 's|^# *DB_DATABASE=.*|DB_DATABASE=laravel_test|' .env
          sed -i 's|^# *DB_USERNAME=.*|DB_USERNAME=laravel|' .env
          sed -i 's|^# *DB_PASSWORD=.*|DB_PASSWORD=password|' .env
          sed -i 's|^SCOUT_DRIVER=.*|SCOUT_DRIVER=database|' .env
          php artisan key:generate --ansi
          mkdir -p storage/framework/{sessions,views,cache/data} storage/logs bootstrap/cache
          chmod -R 775 storage bootstrap/cache

      # ========================================
      # 7. Kiểm tra database configuration
      # ========================================
      - name: Check database configuration
        run: |
          php artisan config:clear
          php artisan about

      # ========================================
      # 8. Clear Laravel cache
      # ========================================
      - name: Clear Laravel cache
        run: php artisan optimize:clear || true

      # ========================================
      # 9. Chạy migration & seeder kiểm tra
      # ========================================
      - name: Run migrations and seeders
        run: php artisan migrate:fresh --seed --force

      # ========================================
      # 10. Chạy Laravel tests
      # ========================================
      - name: Run tests
        run: php artisan test