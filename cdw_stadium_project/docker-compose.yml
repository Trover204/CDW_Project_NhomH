services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: laravel_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - db
      - elasticsearch
    networks:
      - laravel

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: laravel_elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - laravel # Đã gom về chung mạng 'laravel' với app

  db:
    image: mysql:8.4
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel13
      MYSQL_USER: admin
      MYSQL_PASSWORD: 12345
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: laravel_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - laravel
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: laravel_zap
    restart: unless-stopped
    user: zap
    ports:
      - "8082:8080" # Cổng truy cập giao diện Web UI (WebSwing)
      - "8090:8090" # Cổng ZAP Proxy / API
    volumes:
      - ./zap_reports:/zap/wrk:rw # Lưu trữ báo cáo hoặc cấu hình quét ra máy host
    command: zap-webswing.sh
    depends_on:
      - app
    networks:
      - laravel
volumes:
  mysql_data:
  elasticsearch_data:
    driver: local

networks:
  laravel:
    driver: bridge # Gom lại dùng 1 network duy nhất